<div id="option-bot-header">Pocket Option AI Manager</div>
<div class="option-bot-section">
  <p class="option-text">{{ currentSym }}</p>
</div>

<div id="option-bot-buttons" class="option-bot-section">
  <button class="option-button" @click="getHistoricCandleData">
    Get Candle Data
  </button>
  <button class="option-button" @click="startStreaming" :disabled="isStreaming">
    Start Streaming
  </button>
  <button class="option-button" @click="stopStreaming" :disabled="!isStreaming">
    Stop Streaming
  </button>
  <button class="option-button" @click="trainNetWork">Train Data</button>
</div>
